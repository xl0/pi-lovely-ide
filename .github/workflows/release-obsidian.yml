name: Release Obsidian plugin

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.13"
      - name: Validate release tag
        run: |
          bun -e '
            import manifest from "./manifest.json";
            if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(manifest.version) ||
                manifest.version !== process.env.GITHUB_REF_NAME) {
              throw new Error("Release tag must exactly match manifest.json version (x.y.z)");
            }
          '
      - name: Install dependencies
        run: |
          bun install
          bun install --cwd ide-plugins/vscode
          bun install --cwd ide-plugins/obsidian
      - name: Check and build
        run: bun run check
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            ide-plugins/obsidian/main.js \
            manifest.json \
            --verify-tag --draft --generate-notes \
            --title "Pi Lovely IDE for Obsidian $GITHUB_REF_NAME"
